server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/Ecommerce?createDatabaseIfNotExist=true
spring.jpa.show-sql = true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

jwt.access-token.expiration.ms=3600000
jwt.refresh-token.expiration.ms=2592000000

cloudinary.cloud.name = ${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key = ${CLOUDINARY_API_KEY}
cloudinary.api.secret = ${CLOUDINARY_API_SECRET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Steadfast Courier API Configuration
steadfast.api.base-url= ${STEADFAST_API_BASE_URL}}
steadfast.api.key=${STEADFAST_API_KEY}
steadfast.api.secret=${STEADFAST_API_SECRET}
steadfast.api.bulk-pickup-endpoint=${steadfast.api.base-url}/create_order/bulk-order
steadfast.api.single-pickup-endpoint=${steadfast.api.base-url}/create_order


# --- EMAIL (SMTP) CONFIGURATION ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- BDBULKSMS CONFIGURATION ---
bdbulksms.token=${BDBULKSMS_TOKEN}
bdbulksms.api-url=${BDBULKSMS_API_URL}

# ------------------------------------------------------------------
# Google + Facebook login. Loaded ONLY when the "oauth2" profile is active:
# Secrets come from environment variables. NEVER hard-code them (this repo is public).
# ------------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# no "openid" on purpose: keeps Google on the plain OAuth2 path used by CustomOAuth2UserService
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_APP_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_APP_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# Where to send the browser after login (no trailing slash)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# true in production (HTTPS)
app.oauth2.cookie-secure=${APP_OAUTH2_COOKIE_SECURE:false}

# Needed behind Nginx/Cloudflare/etc. so Spring builds https redirect URIs correctly
server.forward-headers-strategy=framework